<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinEdit // by dnezero</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root, [data-theme="dark"] {
            --bg: #0a0a0a;
            --fg: #b0b0b0;
            --gutter-bg: #0a0a0a;
            --gutter-fg: #3a3a3a;
            --caret: #b0b0b0;
            --selection-bg: rgba(255, 255, 255, 0.08);
            --scroll-thumb: #1a1a1a;
            --scroll-thumb-hover: #252525;
            --syn-keyword: #a0a0a0;
            --syn-builtin: #8a9ab0;
            --syn-type: #90947e;
            --syn-title: #9db3c8;
            --syn-attr: #a08e7e;
            --syn-string: #7a9070;
            --syn-literal: #9a8a8a;
            --syn-name: #b09090;
            --syn-var: #b0a0a0;
            --syn-operator: #888;
            --syn-meta: #7a9a9a;
            --syn-comment: #444;
            --syn-quote: #666;
            --spotlight-backdrop: rgba(0, 0, 0, 0.35);
            --spotlight-modal-bg: rgba(255, 255, 255, 0.04);
            --spotlight-modal-border: rgba(255, 255, 255, 0.08);
            --spotlight-modal-shadow-1: rgba(255, 255, 255, 0.06);
            --spotlight-modal-shadow-2: rgba(0, 0, 0, 0.4);
            --spotlight-modal-shadow-3: rgba(0, 0, 0, 0.5);
            --spotlight-input-border: rgba(255, 255, 255, 0.06);
            --spotlight-input-text: #d8d8d8;
            --spotlight-input-ph: #555;
            --spotlight-scrollbar: rgba(255, 255, 255, 0.06);
            --spotlight-item-hover: rgba(255, 255, 255, 0.04);
            --spotlight-item-selected: rgba(255, 255, 255, 0.08);
            --spotlight-item-label: #c0c0c0;
            --spotlight-item-label-sel: #e8e8e8;
            --spotlight-item-desc: #484848;
            --spotlight-item-desc-sel: #707070;
            --spotlight-item-key-bg: rgba(255, 255, 255, 0.03);
            --spotlight-item-key-border: rgba(255, 255, 255, 0.05);
            --spotlight-item-key-text: #383838;
            --spotlight-item-key-text-sel: #606060;
            --spotlight-item-key-border-sel: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --fg: #333333;
            --gutter-bg: #f8f9fa;
            --gutter-fg: #adb5bd;
            --caret: #333333;
            --selection-bg: rgba(0, 0, 0, 0.1);
            --scroll-thumb: #dee2e6;
            --scroll-thumb-hover: #ced4da;
            --syn-keyword: #d73a49;
            --syn-builtin: #005cc5;
            --syn-type: #6f42c1;
            --syn-title: #6f42c1;
            --syn-attr: #22863a;
            --syn-string: #032f62;
            --syn-literal: #005cc5;
            --syn-name: #22863a;
            --syn-var: #e36209;
            --syn-operator: #d73a49;
            --syn-meta: #6a737d;
            --syn-comment: #6a737d;
            --syn-quote: #6a737d;
            --spotlight-backdrop: rgba(255, 255, 255, 0.4);
            --spotlight-modal-bg: rgba(255, 255, 255, 0.85);
            --spotlight-modal-border: rgba(0, 0, 0, 0.1);
            --spotlight-modal-shadow-1: rgba(0, 0, 0, 0.05);
            --spotlight-modal-shadow-2: rgba(0, 0, 0, 0.1);
            --spotlight-modal-shadow-3: rgba(0, 0, 0, 0.15);
            --spotlight-input-border: rgba(0, 0, 0, 0.1);
            --spotlight-input-text: #24292e;
            --spotlight-input-ph: #6a737d;
            --spotlight-scrollbar: rgba(0, 0, 0, 0.1);
            --spotlight-item-hover: rgba(0, 0, 0, 0.04);
            --spotlight-item-selected: rgba(0, 0, 0, 0.08);
            --spotlight-item-label: #24292e;
            --spotlight-item-label-sel: #000000;
            --spotlight-item-desc: #6a737d;
            --spotlight-item-desc-sel: #24292e;
            --spotlight-item-key-bg: rgba(0, 0, 0, 0.04);
            --spotlight-item-key-border: rgba(0, 0, 0, 0.08);
            --spotlight-item-key-text: #586069;
            --spotlight-item-key-text-sel: #24292e;
            --spotlight-item-key-border-sel: rgba(0, 0, 0, 0.15);
        }

        [data-theme="ocean"] {
            --bg: #0f141e;
            --fg: #a6accd;
            --gutter-bg: #0f141e;
            --gutter-fg: #4c566a;
            --caret: #82aaff;
            --selection-bg: rgba(130, 170, 255, 0.2);
            --scroll-thumb: #1e2638;
            --scroll-thumb-hover: #29344d;
            --syn-keyword: #89ddff;
            --syn-builtin: #82aaff;
            --syn-type: #ffcb6b;
            --syn-title: #82aaff;
            --syn-attr: #c792ea;
            --syn-string: #c3e88d;
            --syn-literal: #f78c6c;
            --syn-name: #f07178;
            --syn-var: #eeffff;
            --syn-operator: #89ddff;
            --syn-meta: #546e7a;
            --syn-comment: #546e7a;
            --syn-quote: #546e7a;
            --spotlight-backdrop: rgba(15, 20, 30, 0.4);
            --spotlight-modal-bg: rgba(25, 33, 49, 0.6);
            --spotlight-modal-border: rgba(130, 170, 255, 0.15);
            --spotlight-modal-shadow-1: rgba(130, 170, 255, 0.05);
            --spotlight-modal-shadow-2: rgba(0, 0, 0, 0.4);
            --spotlight-modal-shadow-3: rgba(0, 0, 0, 0.5);
            --spotlight-input-border: rgba(130, 170, 255, 0.15);
            --spotlight-input-text: #eeffff;
            --spotlight-input-ph: #4c566a;
            --spotlight-scrollbar: rgba(130, 170, 255, 0.1);
            --spotlight-item-hover: rgba(130, 170, 255, 0.08);
            --spotlight-item-selected: rgba(130, 170, 255, 0.15);
            --spotlight-item-label: #a6accd;
            --spotlight-item-label-sel: #eeffff;
            --spotlight-item-desc: #546e7a;
            --spotlight-item-desc-sel: #82aaff;
            --spotlight-item-key-bg: rgba(130, 170, 255, 0.05);
            --spotlight-item-key-border: rgba(130, 170, 255, 0.1);
            --spotlight-item-key-text: #546e7a;
            --spotlight-item-key-text-sel: #82aaff;
            --spotlight-item-key-border-sel: rgba(130, 170, 255, 0.2);
        }

        [data-theme="sepia"] {
            --bg: #f4ecd8;
            --fg: #5b4636;
            --gutter-bg: #eaddc5;
            --gutter-fg: #a38d72;
            --caret: #5b4636;
            --selection-bg: rgba(91, 70, 54, 0.15);
            --scroll-thumb: #e2d1b4;
            --scroll-thumb-hover: #d1bfa0;
            --syn-keyword: #8a3a22;
            --syn-builtin: #225b8a;
            --syn-type: #5d3f86;
            --syn-title: #5d3f86;
            --syn-attr: #356b2c;
            --syn-string: #2d6b41;
            --syn-literal: #225b8a;
            --syn-name: #8a3a22;
            --syn-var: #bd5922;
            --syn-operator: #8a3a22;
            --syn-meta: #8a7a62;
            --syn-comment: #8a7a62;
            --syn-quote: #8a7a62;
            --spotlight-backdrop: rgba(244, 236, 216, 0.4);
            --spotlight-modal-bg: rgba(255, 251, 240, 0.85);
            --spotlight-modal-border: rgba(91, 70, 54, 0.1);
            --spotlight-modal-shadow-1: rgba(91, 70, 54, 0.05);
            --spotlight-modal-shadow-2: rgba(91, 70, 54, 0.1);
            --spotlight-modal-shadow-3: rgba(91, 70, 54, 0.15);
            --spotlight-input-border: rgba(91, 70, 54, 0.1);
            --spotlight-input-text: #4a3625;
            --spotlight-input-ph: #a38d72;
            --spotlight-scrollbar: rgba(91, 70, 54, 0.1);
            --spotlight-item-hover: rgba(91, 70, 54, 0.05);
            --spotlight-item-selected: rgba(91, 70, 54, 0.1);
            --spotlight-item-label: #5b4636;
            --spotlight-item-label-sel: #38281a;
            --spotlight-item-desc: #8a7a62;
            --spotlight-item-desc-sel: #5b4636;
            --spotlight-item-key-bg: rgba(91, 70, 54, 0.05);
            --spotlight-item-key-border: rgba(91, 70, 54, 0.1);
            --spotlight-item-key-text: #8a7a62;
            --spotlight-item-key-text-sel: #5b4636;
            --spotlight-item-key-border-sel: rgba(91, 70, 54, 0.15);
        }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        
        .gutter {
            width: 56px;
            background: transparent;
            text-align: right;
            padding: 20px 14px 20px 0;
            color: var(--gutter-fg);
            user-select: none;
            font-size: 13px;
            line-height: 1.6;
            overflow: hidden;
            flex-shrink: 0;
            transition: background 0.3s, color 0.3s;
        }

        
        .editor-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .editor, .backdrop {
            width: 100%;
            height: 100%;
            padding: 20px 20px 20px 16px;
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            white-space: pre;
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            outline: none;
            margin: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            letter-spacing: 0px;
            word-spacing: 0px;
        }

        .editor {
            background: transparent;
            color: transparent;
            caret-color: transparent;
            z-index: 3;
            resize: none;
            overflow: auto;
        }

        .editor::selection {
            background: var(--selection-bg);
        }

        .backdrop {
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: transparent;
        }

        .backdrop code {
            display: block;
            padding: 0 !important;
            margin: 0 !important;
            background: transparent !important;
            font: inherit !important;
            line-height: inherit !important;
            letter-spacing: inherit !important;
            word-spacing: inherit !important;
        }

        .caret-mirror {
            width: 100%;
            height: 100%;
            padding: 20px 20px 20px 16px;
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            white-space: pre;
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            outline: none;
            margin: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            letter-spacing: 0px;
            word-spacing: 0px;
            visibility: hidden;
            pointer-events: none;
        }

        .custom-caret {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            background: var(--caret);
            z-index: 4;
            pointer-events: none;
            transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.3, 1);
            border-radius: 1px;
            opacity: 1;
        }

        .custom-caret.blink {
            animation: caret-blink 1s step-end infinite;
        }

        @keyframes caret-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        
        .editor::-webkit-scrollbar { width: 8px; height: 8px; }
        .editor::-webkit-scrollbar-track { background: transparent; }
        .editor::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
        .editor::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

        
        .hljs                   { background: transparent !important; color: var(--fg) !important; transition: color 0.3s; }
        .hljs-keyword,
        .hljs-selector-tag      { color: var(--syn-keyword); font-weight: 600; }
        .hljs-built_in          { color: var(--syn-builtin); }
        .hljs-type,
        .hljs-class             { color: var(--syn-type); }
        .hljs-title,
        .hljs-title.class_,
        .hljs-title.function_   { color: var(--syn-title); }
        .hljs-function          { color: var(--syn-title); }
        .hljs-attr,
        .hljs-attribute         { color: var(--syn-attr); }
        .hljs-string,
        .hljs-regexp,
        .hljs-addition          { color: var(--syn-string); }
        .hljs-number            { color: var(--syn-attr); }
        .hljs-literal,
        .hljs-symbol,
        .hljs-bullet            { color: var(--syn-literal); }
        .hljs-name,
        .hljs-section           { color: var(--syn-name); }
        .hljs-tag               { color: var(--syn-name); }
        .hljs-variable,
        .hljs-template-variable { color: var(--syn-var); }
        .hljs-operator          { color: var(--syn-operator); }
        .hljs-meta,
        .hljs-meta .hljs-keyword{ color: var(--syn-meta); }
        .hljs-comment,
        .hljs-deletion          { color: var(--syn-comment); font-style: italic; }
        .hljs-doctag            { color: var(--syn-keyword); font-weight: 600; }
        .hljs-quote             { color: var(--syn-quote); font-style: italic; }
        .hljs-template-tag      { color: var(--syn-attr); }
        .hljs-selector-class    { color: var(--syn-attr); }
        .hljs-selector-id       { color: var(--syn-title); }
        .hljs-selector-attr     { color: var(--syn-attr); }
        .hljs-selector-pseudo   { color: var(--syn-builtin); }
        .hljs-property          { color: var(--syn-attr); }
        .hljs-params            { color: var(--fg); }
        .hljs-link              { color: var(--syn-meta); text-decoration: underline; }
        .hljs-punctuation       { color: var(--syn-quote); }
        .hljs-char.escape_      { color: var(--syn-literal); }
        .hljs-subst             { color: var(--fg); }

        
        .spotlight-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 220ms ease;
        }

        .spotlight-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        
        .spotlight-backdrop {
            position: fixed;
            inset: 0;
            background: var(--spotlight-backdrop);
            backdrop-filter: blur(18px) saturate(1.6);
            -webkit-backdrop-filter: blur(18px) saturate(1.6);
            transition: background 0.3s;
        }

        .spotlight-modal {
            position: relative;
            width: 92%;
            max-width: 560px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;

            
            background: var(--spotlight-modal-bg);
            border: 1px solid var(--spotlight-modal-border);
            border-radius: 20px;
            box-shadow:
                0 0 0 0.5px var(--spotlight-modal-shadow-1),
                0 2px 8px var(--spotlight-modal-shadow-2),
                0 12px 40px var(--spotlight-modal-shadow-3),
                inset 0 1px 0 var(--spotlight-modal-shadow-1);
            backdrop-filter: blur(28px) saturate(1.8) brightness(1.05);
            -webkit-backdrop-filter: blur(28px) saturate(1.8) brightness(1.05);

            
            transform: scale(0.95);
            transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 200ms ease, background 0.3s, border-color 0.3s;
            opacity: 0;
            will-change: transform, opacity;
        }

        .spotlight-overlay.active .spotlight-modal {
            transform: scale(1);
            opacity: 1;
        }

        .spotlight-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--spotlight-input-border);
            padding: 18px 22px;
            font-size: 15px;
            color: var(--spotlight-input-text);
            font-family: inherit;
            outline: none;
            transition: color 0.3s, border-color 0.3s;
        }

        .spotlight-input::placeholder {
            color: var(--spotlight-input-ph);
        }

        .spotlight-items {
            overflow-y: auto;
            flex: 1;
            padding: 6px 0;
        }

        .spotlight-items::-webkit-scrollbar { width: 4px; }
        .spotlight-items::-webkit-scrollbar-track { background: transparent; }
        .spotlight-items::-webkit-scrollbar-thumb { background: var(--spotlight-scrollbar); border-radius: 2px; }

        .spotlight-item {
            padding: 11px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            transition: background 120ms ease;
            border-radius: 0;
        }

        .spotlight-item:hover {
            background: var(--spotlight-item-hover);
        }

        .spotlight-item.selected {
            background: var(--spotlight-item-selected);
        }

        .spotlight-item-label {
            color: var(--spotlight-item-label);
            transition: color 0.3s;
        }

        .spotlight-item.selected .spotlight-item-label {
            color: var(--spotlight-item-label-sel);
        }

        .spotlight-item-desc {
            font-size: 12px;
            color: var(--spotlight-item-desc);
            transition: color 0.3s;
        }

        .spotlight-item.selected .spotlight-item-desc {
            color: var(--spotlight-item-desc-sel);
        }

        .spotlight-item-key {
            font-size: 11px;
            color: var(--spotlight-item-key-text);
            background: var(--spotlight-item-key-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--spotlight-item-key-border);
            transition: all 0.3s;
        }

        .spotlight-item.selected .spotlight-item-key {
            color: var(--spotlight-item-key-text-sel);
            border-color: var(--spotlight-item-key-border-sel);
        }


        .line-highlight {
            position: absolute;
            left: 0;
            width: 100%;
            background: var(--selection-bg);
            pointer-events: none;
            z-index: 2;
        }

        .minimap {
            width: 80px;
            background: transparent;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: none;
            cursor: pointer;
            user-select: none;
        }

        .minimap-content {
            font-size: 2px;
            line-height: 1.6;
            white-space: pre;
            color: var(--fg);
            opacity: 0.6;
            padding: 5px;
            transform-origin: top left;
            pointer-events: none;
        }

        .minimap-viewport {
            position: absolute;
            right: 0;
            width: 100%;
            background: transparent;
            border: 1px solid var(--fg);
            opacity: 0.2;
            pointer-events: none;
            transition: top 0.1s;
        }

        .toast-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: min(320px, calc(100% - 40px));
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(18px) saturate(1.05);
            color: var(--fg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            transition: visibility 0s linear 240ms;
            z-index: 120;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toast-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 240ms ease, transform 240ms ease;
            animation: toast-appear 260ms ease;
        }

        @keyframes toast-appear {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .toast-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--fg);
        }

        .toast-desc {
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 10px;
            color: var(--spotlight-item-desc);
        }

        .toast-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toast-btn {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font: inherit;
            color: var(--spotlight-item-desc);
            background: transparent;
            transition: color 150ms ease, background 150ms ease;
        }

        .toast-btn:hover {
            color: var(--fg);
            background: rgba(255,255,255,0.08);
        }

        .toast-btn.secondary {
            color: var(--fg);
            opacity: 0.6;
        }

        .search-bar {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%) translateY(12px);
            padding: 10px 14px;
            width: min(560px, calc(100% - 40px));
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 14px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 18px 45px rgba(0,0,0,0.12);
            backdrop-filter: blur(24px) saturate(1.08);
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(12px);
            transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
            z-index: 130;
        }

        .search-bar.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--fg);
            font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            min-width: 0;
        }

        .search-bar input::placeholder {
            color: var(--spotlight-item-desc);
        }

        .search-count {
            color: var(--spotlight-item-desc);
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="gutter" id="gutter">1</div>
    <div class="editor-wrap">
        <pre class="backdrop"><code id="highlight-area" class="language-plaintext"></code></pre>
        <div class="caret-mirror" id="caret-mirror"></div>
        <div class="custom-caret" id="custom-caret"></div>
        <textarea class="editor" id="editor" spellcheck="false" autocomplete="off" autofocus></textarea>
    </div>
    <div class="minimap" id="minimap">
        <div class="minimap-content" id="minimap-content"></div>
        <div class="minimap-viewport" id="minimap-viewport"></div>
    </div>
</div>


<div class="spotlight-overlay" id="spotlight-overlay">
    <div class="spotlight-backdrop"></div>
    <div class="spotlight-modal">
        <input type="text" class="spotlight-input" id="spotlight-input" placeholder="Search...">
        <div class="spotlight-items" id="spotlight-items"></div>
    </div>
</div>

<div class="toast-container" id="welcome-toast">
    <div class="toast-title">Welcome to MinEdit</div>
    <div class="toast-desc">Made by dnezero! To access the menu, press esc.</div>
    <div class="toast-actions">
        <button class="toast-btn" id="toast-ok">OK</button>
        <button class="toast-btn secondary" id="toast-dismiss">Don't show again</button>
    </div>
</div>

<div class="search-bar" id="search-bar">
    <input type="text" id="search-input" placeholder="Search in file...">
    <div class="search-count" id="search-count"></div>
</div>

<input type="file" id="file-input" style="display:none">

<script>
    const editor       = document.getElementById('editor');
    const highlightArea= document.getElementById('highlight-area');
    const gutter       = document.getElementById('gutter');
    const fileInput    = document.getElementById('file-input');
    const overlay      = document.getElementById('spotlight-overlay');
    const sInput       = document.getElementById('spotlight-input');
    const sItems       = document.getElementById('spotlight-items');
    const searchBar    = document.getElementById('search-bar');
    const searchInput  = document.getElementById('search-input');
    const searchCount  = document.getElementById('search-count');
    const caretMirror  = document.getElementById('caret-mirror');
    const customCaret  = document.getElementById('custom-caret');

    let searchMatches = [];
    let searchIndex = 0;

    function openSearch() {
        if (overlay.classList.contains('active')) return;
        if (searchBar.classList.contains('active')) return;
        searchBar.classList.add('active');
        searchInput.value = '';
        searchCount.textContent = '';
        searchMatches = [];
        searchIndex = 0;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                searchInput.focus();
                searchInput.select();
            });
        });
    }

    function closeSearch() {
        searchBar.classList.remove('active');
        editor.focus();
    }

    function updateSearch() {
        const query = searchInput.value;
        searchMatches = [];
        searchIndex = 0;
        if (!query) {
            searchCount.textContent = '';
            return;
        }
        const text = editor.value;
        let idx = text.indexOf(query, 0);
        while (idx !== -1) {
            searchMatches.push(idx);
            idx = text.indexOf(query, idx + query.length);
        }
        if (!searchMatches.length) {
            searchCount.textContent = '0 results';
            return;
        }
        selectSearchResult(0);
        searchCount.textContent = `${searchIndex + 1} / ${searchMatches.length}`;
    }

    function selectSearchResult(index) {
        if (!searchMatches.length) return;
        searchIndex = (index + searchMatches.length) % searchMatches.length;
        const start = searchMatches[searchIndex];
        const end = start + searchInput.value.length;
        editor.focus();
        editor.selectionStart = start;
        editor.selectionEnd = end;
        editor.scrollTop = editor.scrollHeight * (start / Math.max(editor.value.length, 1));
        requestAnimationFrame(updateCaret);
        searchCount.textContent = `${searchIndex + 1} / ${searchMatches.length}`;
    }

    function nextSearchResult() {
        if (!searchMatches.length) return;
        selectSearchResult(searchIndex + 1);
    }

    function prevSearchResult() {
        if (!searchMatches.length) return;
        selectSearchResult(searchIndex - 1);
    }

    searchInput.addEventListener('input', updateSearch);
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            e.preventDefault();
            closeSearch();
        }
        if (e.key === 'Enter') {
            e.preventDefault();
            if (e.shiftKey) prevSearchResult();
            else nextSearchResult();
        }
    });

    const fonts = [
        { label: 'System Mono', family: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace' },
        { label: 'Fira Code', family: '"Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace' },
        { label: 'JetBrains Mono', family: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace' },
        { label: 'IBM Plex Mono', family: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace' },
        { label: 'Cascadia Code', family: '"Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace' },
    ];

    function getFontLabel(family) {
        const font = fonts.find(f => f.family === family);
        return font ? font.label : family;
    }

    function loadSettings() {
        const font = localStorage.getItem('minedit_font') || fonts[0].family;
        return {
            fontSize: parseInt(localStorage.getItem('minedit_fontSize'), 10) || 13,
            fontFamily: font,
            fontFamilyLabel: getFontLabel(font),
            language: localStorage.getItem('minedit_language') || 'plaintext',
            theme: localStorage.getItem('minedit_theme') || 'dark',
            showMinimap: localStorage.getItem('minedit_minimap') === 'true',
            showLineNumbers: localStorage.getItem('minedit_showLineNumbers') !== 'false',
            currentFile: null,
            isDirty: false
        };
    }

    function saveSettings() {
        localStorage.setItem('minedit_font', settings.fontFamily);
        localStorage.setItem('minedit_fontSize', settings.fontSize);
        localStorage.setItem('minedit_language', settings.language);
        localStorage.setItem('minedit_theme', settings.theme);
        localStorage.setItem('minedit_minimap', settings.showMinimap);
        localStorage.setItem('minedit_showLineNumbers', settings.showLineNumbers);
    }

    function shouldShowWelcome() {
        return localStorage.getItem('minedit_hideWelcome') !== 'true';
    }

    function hideWelcomeToast(persist = false) {
        const toast = document.getElementById('welcome-toast');
        toast.classList.remove('active');
        if (persist) {
            localStorage.setItem('minedit_hideWelcome', 'true');
        }
    }

    function showWelcomeToast() {
        if (!shouldShowWelcome()) return;
        const toast = document.getElementById('welcome-toast');
        toast.classList.add('active');
    }

    let settings = loadSettings();
    
    const BUFFER_LINES = 50;
    const lineHighlight = document.getElementById('line-highlight');
    const minimap = document.getElementById('minimap');
    const minimapContent = document.getElementById('minimap-content');
    const minimapViewport = document.getElementById('minimap-viewport');

    
    
    document.documentElement.setAttribute('data-theme', settings.theme);

    let hlTimeout;
    let selIdx = 0;
    let menuStack = ['root'];

    
    function scheduleHighlight() {
        clearTimeout(hlTimeout);
        hlTimeout = setTimeout(() => { updateHighlight(); updateGutter(); }, 40);
    }

    function getLinesSlice(text, startLine, endLine) {
        let currentLine = 0;
        let startIndex = 0;
        while (currentLine < startLine && startIndex < text.length) {
            let idx = text.indexOf('\n', startIndex);
            if (idx === -1) { startIndex = text.length; break; }
            startIndex = idx + 1;
            currentLine++;
        }
        let endIndex = startIndex;
        while (currentLine < endLine && endIndex < text.length) {
            let idx = text.indexOf('\n', endIndex);
            if (idx === -1) { endIndex = text.length; break; }
            endIndex = idx + 1;
            currentLine++;
        }
        return text.substring(startIndex, endIndex);
    }

    function updateHighlight() {
        let text = editor.value;
        if (text.endsWith('\n')) text += ' ';
        highlightArea.textContent = text || ' ';
        highlightArea.className = 'language-' + settings.language;
        delete highlightArea.dataset.highlighted;
        try { hljs.highlightElement(highlightArea); } catch(e) {}
        highlightArea.style.removeProperty('transform');
    }

    let lastLineCount = 0;
    function updateGutter() {
        const n = editor.value.split('\n').length;
        if (n === lastLineCount) return;
        lastLineCount = n;
        let s = '';
        for (let i = 1; i <= n; i++) s += i + '<br>';
        gutter.innerHTML = s;
    }

    function updateCaret() {
        const dir = editor.selectionDirection;
        const pos = dir === 'backward' ? editor.selectionStart : editor.selectionEnd;
        const textBefore = editor.value.substring(0, pos);
        
        caretMirror.textContent = textBefore;
        const span = document.createElement('span');
        span.textContent = '\u200b';
        caretMirror.appendChild(span);
        
        const top = span.offsetTop;
        const left = span.offsetLeft;
        
        const tx = left - editor.scrollLeft;
        const ty = top - editor.scrollTop;
        customCaret.style.transform = `translate(${tx}px, ${ty}px)`;
        
        if (editor.selectionStart !== editor.selectionEnd || document.activeElement !== editor) {
            customCaret.style.display = 'none';
        } else {
            customCaret.style.display = 'block';
        }
        
        customCaret.classList.remove('blink');
        void customCaret.offsetWidth;
        customCaret.classList.add('blink');
    }

    function applyFontSize() {
        const v = settings.fontSize + 'px';
        const lh = (settings.fontSize * 1.6) + 'px';
        [editor, highlightArea, highlightArea.parentElement, gutter, caretMirror].forEach(el => {
            if (el) {
                el.style.fontSize = v;
                el.style.lineHeight = lh;
                el.style.fontFamily = settings.fontFamily;
            }
        });
        if (customCaret) customCaret.style.height = settings.fontSize + 'px';
        requestAnimationFrame(updateCaret);
    }

    
    editor.addEventListener('scroll', () => {
        highlightArea.parentElement.scrollTop  = editor.scrollTop;
        highlightArea.parentElement.scrollLeft = editor.scrollLeft;
        gutter.scrollTop = editor.scrollTop;
    });

    editor.addEventListener('input', () => {
        settings.isDirty = true;
        scheduleHighlight();
        updateMinimapText();
    });

    ['scroll', 'focus', 'blur', 'input'].forEach(ev => {
        editor.addEventListener(ev, () => {
            requestAnimationFrame(updateCaret);
            requestAnimationFrame(updateMinimapViewport);
            scheduleHighlight();
        });
    });
    document.addEventListener('selectionchange', () => {
        requestAnimationFrame(updateCaret);
        requestAnimationFrame(updateMinimapViewport);
        scheduleHighlight();
    });

    
    editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = editor.selectionStart, end = editor.selectionEnd;
            editor.value = editor.value.substring(0, s) + '    ' + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = s + 4;
            editor.dispatchEvent(new Event('input'));
            return;
        }
        if (e.key === 'Escape' && searchBar.classList.contains('active')) {
            e.preventDefault();
            closeSearch();
            return;
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            openSpotlight();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            openSearch();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); newFile(); }
    });

    
    function newFile() {
        if (settings.isDirty && !confirm('Discard unsaved changes?')) return;
        editor.value = '';
        settings.currentFile = null;
        settings.isDirty = false;
        settings.language = 'plaintext';
        scheduleHighlight();
        updateMinimapText();
    }

    function openFile() { fileInput.click(); }

    function saveFile() {
        let name = settings.currentFile || prompt('Save as:', 'file.txt');
        if (!name) return;
        settings.currentFile = name;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([editor.value], {type:'text/plain'}));
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
        settings.isDirty = false;
    }

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            editor.value = ev.target.result;
            settings.currentFile = file.name;
            settings.language = detectLang(file.name);
            settings.isDirty = false;
            scheduleHighlight();
        updateMinimapText();
        };
        reader.readAsText(file);
    });

    function detectLang(f) {
        const ext = f.split('.').pop().toLowerCase();
        return {
            'js':'javascript','mjs':'javascript','cjs':'javascript',
            'ts':'typescript','tsx':'typescript',
            'jsx':'javascript',
            'py':'python','pyw':'python',
            'rb':'ruby','rs':'rust','go':'go',
            'java':'java','kt':'kotlin','kts':'kotlin',
            'c':'c','h':'c','cpp':'cpp','cxx':'cpp','cc':'cpp','hpp':'cpp',
            'cs':'csharp',
            'swift':'swift','m':'objectivec','mm':'objectivec',
            'html':'xml','htm':'xml','xhtml':'xml','xml':'xml','svg':'xml',
            'css':'css','scss':'scss','sass':'scss','less':'less',
            'json':'json','yaml':'yaml','yml':'yaml','toml':'ini',
            'md':'markdown','mdx':'markdown',
            'sh':'bash','zsh':'bash','bash':'bash','fish':'bash',
            'sql':'sql',
            'php':'php',
            'r':'r',
            'lua':'lua',
            'pl':'perl','pm':'perl',
            'ex':'elixir','exs':'elixir',
            'erl':'erlang',
            'hs':'haskell',
            'ml':'ocaml','mli':'ocaml',
            'scala':'scala',
            'clj':'clojure','cljs':'clojure',
            'dart':'dart',
            'zig':'zig',
            'nim':'nim',
            'v':'verilog','sv':'verilog',
            'dockerfile':'dockerfile',
            'makefile':'makefile',
            'cmake':'cmake',
            'tf':'hcl',
            'proto':'protobuf',
            'graphql':'graphql','gql':'graphql',
            'vue':'xml',
            'svelte':'xml',
            'wasm':'wasm',
            'asm':'x86asm','s':'x86asm',
            'ini':'ini','cfg':'ini','conf':'ini',
            'diff':'diff','patch':'diff',
        }[ext] || 'plaintext';
    }

    
    const languages = [
        'plaintext','javascript','typescript','python','ruby','rust','go','java',
        'kotlin','c','cpp','csharp','swift','objectivec','bash','sql','php','r',
        'lua','perl','elixir','erlang','haskell','ocaml','scala','clojure','dart',
        'zig','nim','css','scss','less','xml','json','yaml','markdown','ini',
        'diff','dockerfile','makefile','cmake','protobuf','graphql','x86asm','wasm'
    ];

    const themesList = ['dark', 'light', 'ocean', 'sepia'];

    const menus = {
        root: () => [
            { label: 'New File',      key: 'Ctrl+N', action: () => { closeSpotlight(); newFile(); }},
            { label: 'Open File',     key: 'Ctrl+O', action: () => { closeSpotlight(); openFile(); }},
            { label: 'Save File',     key: 'Ctrl+S', action: () => { closeSpotlight(); saveFile(); }},
            { label: 'Set Language',  desc: settings.language, sub: 'language' },
            { label: 'Set Theme',     desc: settings.theme.charAt(0).toUpperCase() + settings.theme.slice(1), sub: 'theme' },
            { label: 'Set Font',      desc: settings.fontFamilyLabel, sub: 'font' },
            { label: 'Font Size',     desc: settings.fontSize + 'px', sub: 'fontsize' },
            { label: settings.showLineNumbers ? 'Hide Line Numbers' : 'Show Line Numbers', key: '', action: () => { toggleLineNumbers(); closeSpotlight(); } },
            { label: 'Toggle Minimap',  key: '', action: () => { toggleMinimap(); closeSpotlight(); } },
        ],
        language: () => languages.map(l => ({
            label: l,
            action: () => { settings.language = l; updateHighlight(); saveSettings(); closeSpotlight(); }
        })),
        theme: () => themesList.map(t => ({
            label: t.charAt(0).toUpperCase() + t.slice(1),
            action: () => { 
                settings.theme = t; 
                document.documentElement.setAttribute('data-theme', t);
                saveSettings();
                closeSpotlight(); 
            }
        })),
        fontsize: () => [10,11,12,13,14,15,16,18,20,22,24].map(s => ({
            label: s + 'px',
            action: () => { settings.fontSize = s; applyFontSize(); updateHighlight(); updateGutter(); saveSettings(); closeSpotlight(); }
        })),
        font: () => fonts.map(f => ({
            label: f.label,
            action: () => {
                settings.fontFamily = f.family;
                settings.fontFamilyLabel = f.label;
                applyFontSize();
                saveSettings();
                closeSpotlight();
            }
        })),
    };

    function currentMenuId() { return menuStack[menuStack.length - 1]; }

    function getFiltered() {
        const items = menus[currentMenuId()]();
        const q = sInput.value.toLowerCase();
        if (!q) return items;
        return items.filter(i => i.label.toLowerCase().includes(q));
    }

    function renderItems() {
        sItems.innerHTML = '';
        const filtered = getFiltered();
        if (selIdx >= filtered.length) selIdx = Math.max(0, filtered.length - 1);

        
        if (currentMenuId() !== 'root') {
            const back = document.createElement('div');
            back.className = 'spotlight-item' + (selIdx === -1 ? ' selected' : '');
            back.innerHTML = '<span class="spotlight-item-label" style="color:#555">← Back</span>';
            back.onclick = goBack;
            sItems.appendChild(back);
            if (selIdx === -1) {
                requestAnimationFrame(() => back.scrollIntoView({ block: 'nearest' }));
            }
        }

        filtered.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'spotlight-item' + (i === selIdx ? ' selected' : '');

            let html = '<span class="spotlight-item-label">' + esc(item.label) + '</span>';
            if (item.desc) html += '<span class="spotlight-item-desc">' + esc(item.desc) + '</span>';
            if (item.key) html += '<span class="spotlight-item-key">' + esc(item.key) + '</span>';
            if (item.sub) html += '<span class="spotlight-item-desc">→</span>';
            div.innerHTML = html;

            div.onclick = () => activateItem(item);
            sItems.appendChild(div);
            if (i === selIdx) {
                requestAnimationFrame(() => div.scrollIntoView({ block: 'nearest' }));
            }
        });
    }

    function esc(s) {
        const d = document.createElement('span');
        d.textContent = s;
        return d.innerHTML;
    }

    function activateItem(item) {
        if (item.sub) {
            menuStack.push(item.sub);
            sInput.value = '';
            selIdx = 0;
            renderItems();
            sInput.focus();
        } else if (item.action) {
            item.action();
        }
    }

    function goBack() {
        if (menuStack.length > 1) {
            menuStack.pop();
            sInput.value = '';
            selIdx = 0;
            renderItems();
            sInput.focus();
        }
    }

    function openSpotlight() {
        menuStack = ['root'];
        sInput.value = '';
        selIdx = 0;
        overlay.classList.add('active');
        renderItems();
        setTimeout(() => sInput.focus(), 30);
    }

    function closeSpotlight() {
        overlay.classList.remove('active');
        editor.focus();
    }

    sInput.addEventListener('input', () => { selIdx = 0; renderItems(); });

    sInput.addEventListener('keydown', (e) => {
        const filtered = getFiltered();
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (filtered.length) selIdx = (selIdx + 1) % filtered.length;
            renderItems();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (filtered.length) selIdx = (selIdx - 1 + filtered.length) % filtered.length;
            renderItems();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (filtered.length && filtered[selIdx]) activateItem(filtered[selIdx]);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            if (menuStack.length > 1) goBack();
            else closeSpotlight();
        }
    });

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay || e.target.classList.contains('spotlight-backdrop')) closeSpotlight();
    });

    
    function updateMinimapText() {
        if (!settings.showMinimap) return;
        minimapContent.textContent = editor.value;
        updateMinimapViewport();
    }
    
    function updateMinimapViewport() {
        if (!settings.showMinimap) return;
        const ratio = minimap.offsetHeight / editor.scrollHeight;
        const viewportHeight = editor.clientHeight * ratio;
        const viewportTop = editor.scrollTop * ratio;
        minimapViewport.style.height = viewportHeight + 'px';
        minimapViewport.style.transform = `translateY(${viewportTop}px)`;
    }
    
    function toggleMinimap() {
        settings.showMinimap = !settings.showMinimap;
        saveSettings();
        minimap.style.display = settings.showMinimap ? 'block' : 'none';
        if (settings.showMinimap) updateMinimapText();
    }

    function toggleLineNumbers() {
        settings.showLineNumbers = !settings.showLineNumbers;
        saveSettings();
        gutter.style.display = settings.showLineNumbers ? 'block' : 'none';
    }
    
    minimap.addEventListener('mousedown', (e) => {
        if (!settings.showMinimap) return;
        const ratio = editor.scrollHeight / minimap.offsetHeight;
        editor.scrollTop = e.offsetY * ratio - (editor.clientHeight / 2);
    });

    const welcomeToast = document.getElementById('welcome-toast');
    const toastOk = document.getElementById('toast-ok');
    const toastDismiss = document.getElementById('toast-dismiss');

    toastOk.addEventListener('click', () => hideWelcomeToast(false));
    toastDismiss.addEventListener('click', () => hideWelcomeToast(true));

    
    minimap.style.display = settings.showMinimap ? 'block' : 'none';
    gutter.style.display = settings.showLineNumbers ? 'block' : 'none';
    if (settings.showMinimap) updateMinimapText();
    applyFontSize();
    updateHighlight();
    updateGutter();
    setTimeout(showWelcomeToast, 1000);
</script>
</body>
</html>
